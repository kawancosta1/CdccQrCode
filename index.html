<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8a3354" />
    <meta
      name="description"
      content="Sistema de localização física de livros da Biblioteca do CDCC - USP São Carlos por código de classificação Dedalus."
    />
    <meta property="og:title" content="QRCodeCDCC — Localizador de Livros | Biblioteca CDCC USP" />
    <meta
      property="og:description"
      content="Encontre a estante exata do seu livro no acervo do CDCC-USP pelo código Dedalus, explore mapas interativos e jogue no Espaço Lúdico."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kawancosta1.github.io/CdccQrCode/" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>QRCodeCDCC — Localizador de Livros | Biblioteca CDCC USP</title>
  </head>
  <body>
    <script>
      // Este script restaura a URL original que veio do 404.html redirect.
      // Exemplo: /CdccQrCode/?p=/estantes → restaura para /CdccQrCode/estantes
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>

    <!-- Widget Oficial VLibras (carregamento assíncrono não bloqueante) -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script>
      (function () {
        function loadVLibras() {
          if (document.getElementById('vlibras-plugin-script')) return;
          var s = document.createElement('script');
          s.id = 'vlibras-plugin-script';
          s.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
          s.async = true;
          s.onload = function () {
            try {
              if (window.VLibras && window.VLibras.Widget) {
                new window.VLibras.Widget('https://vlibras.gov.br/app');
              }
            } catch (e) {
              console.warn('VLibras indisponível no momento:', e);
            }
          };
          document.body.appendChild(s);
        }

        if (document.readyState === 'complete') {
          loadVLibras();
        } else {
          window.addEventListener('load', loadVLibras, { once: true });
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
