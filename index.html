<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistema de localização física de livros da Biblioteca do CDCC - USP São Carlos por código de classificação Dedalus."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>QRCodeCDCC — Localizador de Livros | Biblioteca CDCC USP</title>
    <script type="module" crossorigin src="/CdccQrCode/assets/index-BMZzuubE.js"></script>
    <link rel="stylesheet" crossorigin href="/CdccQrCode/assets/index-CgpU1K_D.css">
  </head>
  <body>
    <script>
      // Este script restaura a URL original que veio do 404.html redirect.
      // Exemplo: /CdccQrCode/?p=/estantes → restaura para /CdccQrCode/estantes
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>
  </body>
</html>
